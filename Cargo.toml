[package]
name = "bypio"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# ring (not the default aws-lc-rs) avoids a cmake dependency in the
# devcontainer.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"

[build-dependencies]
cc = "1"

# bindgen (and the libclang it needs) is only required where a real DPDK
# build can happen. Keeping it target-gated spares non-Linux machines,
# which use the stub FFI declarations anyway, from compiling it.
[target.'cfg(target_os = "linux")'.build-dependencies]
bindgen = "0.71"
