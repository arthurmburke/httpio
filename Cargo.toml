[package]
name = "httpio"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
# Used by `core` and the transport-agnostic `http` traits, so always needed.
# `serde` lets the `Raw` codec body derive Serialize/Deserialize.
bytes = { version = "1", features = ["serde"] }
http = "1"
gxhash = "3.5"
# The `http` trait module references `hyper::body::Incoming` in its upgrade
# API, so hyper is always required.
hyper = { version = "1", features = ["client", "http1", "http2"] }
# Incremental HTTP/1.1 response-head parser for the hand-rolled, zero-copy h1
# codec (`dpdk::http::h1`). Tiny, allocation-free, the de-facto standard.
httparse = "1"

# Content-negotiated body codecs (`http::codec`): a generic body is
# (de)serialized per the Content-Type header. One crate per supported media
# type. All portable Rust.
serde = { version = "1", features = ["derive"] }
serde_json = "1"                                  # application/json
serde_urlencoded = "0.7"                          # application/x-www-form-urlencoded
serde_plain = "1"                                 # text/plain
quick-xml = { version = "0.37", features = ["serialize"] }  # application/xml

# Used only by the `dpdk` module, which is gated by the `have_dpdk` cfg that
# build.rs sets when libdpdk is found. These are all portable Rust and build
# on any host; only libdpdk itself (a C library) gates the stack, so they
# stay regular (non-optional) dependencies.
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
# ring (not the default aws-lc-rs) avoids a cmake dependency in the
# devcontainer.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
# Already in the tree via rustls; used directly by the WebSocket client
# for Sec-WebSocket-Key randomness and the SHA-1 accept-key check.
ring = "0.17"
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "sync"] }
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"

[build-dependencies]
# build.rs probes pkg-config for libdpdk; when it's present it sets the
# `have_dpdk` cfg and uses bindgen to generate the FFI (including wrappers
# for DPDK's `static inline` hot-path functions via `wrap_static_fns`) and
# cc to compile them. When libdpdk is absent the script is a near no-op and
# the DPDK stack is compiled out. Build/test the DPDK stack in the
# devcontainer.
bindgen = "0.71"
cc = "1"
pkg-config = "0.3"
