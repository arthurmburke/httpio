[package]
name = "bypio"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# ring (not the default aws-lc-rs) avoids a cmake dependency in the
# devcontainer.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
# Already in the tree via rustls; used directly by the WebSocket client
# for Sec-WebSocket-Key randomness and the SHA-1 accept-key check.
ring = "0.17"
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "sync"] }
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
gxhash = "3.5"

[build-dependencies]
# DPDK is a hard build requirement: bindgen generates the FFI (including
# wrappers for DPDK's `static inline` hot-path functions via
# `wrap_static_fns`), cc compiles those generated wrappers, and pkg-config
# locates libdpdk and its link flags. Build/test in the devcontainer.
bindgen = "0.71"
cc = "1"
pkg-config = "0.3"
